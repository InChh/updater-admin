[build]
  command = "pnpm build"
  publish = "dist/client"
[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.28.2"
[functions]
  node_bundler = "esbuild"
[dev]
  command = "pnpm dev"
  targetPort = 3000
  port = 8888

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
